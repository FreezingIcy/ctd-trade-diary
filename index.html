<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CTD">
<title>CTD</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
button,.tab-btn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
:root{
  --bg:#F2F2F7;--card:#FFFFFF;--text:#000000;--sub:#6C6C70;--hint:#AEAEB2;
  --border:#C6C6C8;--green:#34C759;--red:#FF3B30;--orange:#FF9500;
  --blue:#007AFF;--acc:#0D7377;--purple:#5856D6;
  --strat:#0D7377;--stratbg:rgba(13,115,119,.12);
}
@media(prefers-color-scheme:dark){:root{
  --bg:#1C1C1E;--card:#2C2C2E;--text:#FFFFFF;--sub:#AEAEB2;--hint:#636366;--border:#38383A;
  --strat:#2DD4BF;--stratbg:rgba(45,212,191,.16);
}}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:16px;padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.header{background:var(--acc);color:#fff;padding:52px 16px 0;display:flex;flex-direction:column}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.header h1{font-size:17px;font-weight:600;flex:1}
.save-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s}
.save-dot.on{background:#34C759}
.save-btn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:none;border-radius:20px;background:rgba(255,255,255,.18);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s}
.save-btn.saved{background:#34C759}
.manual-btn{display:flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:20px;background:rgba(255,255,255,.22);color:#fff;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;margin-right:8px}
.manual-overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:1000;display:none;opacity:0;transition:opacity .2s}
.manual-overlay.on{display:block;opacity:1}
.manual-sheet{position:absolute;left:0;right:0;bottom:0;top:46px;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;overflow:hidden;transform:translateY(100%);transition:transform .26s ease}
.manual-overlay.on .manual-sheet{transform:translateY(0)}
.manual-sheet-h{background:var(--acc);color:#fff;padding:10px 16px 14px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.manual-grab{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.5);margin:0 auto 8px}
.manual-x{font-size:22px;color:rgba(255,255,255,.85);line-height:1;cursor:pointer;padding:0 4px}
.manual-body{padding:14px 14px 40px;overflow:auto;-webkit-overflow-scrolling:touch}
.m-sec{font-size:11px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 6px 2px}
.m-sec:first-child{margin-top:0}
.m-card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:8px}
.m-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:.5px solid var(--border);gap:10px}
.m-row:last-child{border-bottom:none}
.m-row.top{align-items:flex-start}
.m-l{font-size:14px;color:var(--sub)}
.m-v{font-size:13px;color:var(--sub);text-align:right}
.m-hint{font-size:11px;color:var(--hint);padding:3px 2px 8px}
.m-sym{font-size:14px;font-weight:500;width:80px;flex-shrink:0;color:var(--text)}
.m-symd{font-size:12px;color:var(--sub);flex:1}
.m-symn{font-size:11px;color:var(--hint)}
.m-ph{padding:12px 14px;font-size:13px;color:var(--hint)}
.m-ghd{font-size:12px;font-weight:700;color:var(--acc);letter-spacing:.02em;padding:9px 14px;background:var(--stratbg)}
.m-gintro{font-size:13px;color:var(--sub);padding:12px 14px;line-height:1.5;border-bottom:.5px solid var(--border)}
.m-step{display:flex;gap:11px;padding:11px 14px;border-bottom:.5px solid var(--border);align-items:flex-start}
.m-step:last-child{border-bottom:none}
.m-num{flex-shrink:0;width:21px;height:21px;border-radius:50%;background:var(--acc);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;margin-top:1px}
.m-stext{font-size:13px;color:var(--text);line-height:1.6}
.m-stext b{font-weight:600}
.m-stext .mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:12px;background:var(--bg);padding:1px 5px;border-radius:4px}
.m-code{background:#1C1C1E;color:#E5E5EA;font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:11px;line-height:1.55;padding:12px;border-radius:8px;overflow-x:auto;white-space:pre;margin:4px 12px 10px}
@media(prefers-color-scheme:dark){.m-code{background:#000}}
.tab-bar{display:flex;gap:8px;padding:0 0 12px}
.tab-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:rgba(255,255,255,.15);color:rgba(255,255,255,.7);transition:.15s}
.tab-btn.on{background:#fff;color:var(--acc)}
.page{display:none;padding:14px}
.page.on{display:block}
.cr{color:var(--red)}.co{color:var(--orange)}.cb{color:var(--blue)}.cg{color:var(--green)}
.entry-row{border-top:1.5px solid var(--acc)!important}
.sl-row{border-bottom:1.5px solid var(--orange)!important}




.stitle{font-size:12px;font-weight:500;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 7px 2px}
.stitle:first-child{margin-top:0}
.card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:10px}
.row{display:flex;align-items:center;min-height:48px;padding:0 14px;border-bottom:.5px solid var(--border)}
.row:last-child{border-bottom:none}
.rl{flex:1;font-size:15px}
.row input,.row select{background:transparent;border:none;font-size:15px;font-weight:500;color:var(--blue);text-align:right;width:130px;outline:none;font-family:inherit;-webkit-appearance:none}
.row select{color:var(--text)}
option{color:#000}




.drow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid var(--border)}
.drow:last-child{border-bottom:none}
.dl{font-size:14px;color:var(--sub)}.dv{font-size:14px;font-weight:500}
.toggle-bar{display:flex;background:var(--border);border-radius:10px;padding:2px;gap:2px;margin-bottom:10px}
.toggle-btn{flex:1;padding:8px;border:none;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--sub);transition:.15s}
.toggle-btn.on{background:var(--card);color:var(--acc);font-weight:600}
.apply-btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;margin-bottom:4px}
.apply-btn:active{opacity:.8}
.btn-row{display:flex;gap:8px;margin-top:8px}
.action-btn{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:500;cursor:pointer}
.btn-save-main{background:var(--acc);color:#fff}
.btn-reset{background:var(--card);color:var(--red)}
.btn-import{background:var(--acc);color:#fff;flex:2!important}
.btn-import.confirm{background:var(--orange)}
.score-warn{background:#FFFBE6;border:1.5px solid #FFD60A;border-radius:12px;transition:background .3s,border .3s}
@media(prefers-color-scheme:dark){.score-warn{background:#2D2800;border-color:#FFD60A}}
.note-input{width:100%;background:var(--bg);border:none;border-radius:8px;font-size:14px;color:var(--text);font-family:inherit;resize:none;outline:none;padding:8px 10px;line-height:1.5;min-height:36px;overflow:hidden}
.chip{font-size:11px;font-weight:500;padding:2px 7px;border-radius:6px;display:inline-block}
.chip-pct{background:#FFF3E0;color:#854F0B}
.chip-pip{background:#F2F2F7;color:#5F5E5A}
.chip-dist{background:#E6F1FB;color:#0C447C}
.os-g2{display:grid;grid-template-columns:1fr 1fr;background:var(--card)}
.os-cell{padding:10px 14px;border-right:.5px solid var(--border);border-bottom:.5px solid var(--border)}
.os-cell:nth-child(2n){border-right:none}
.os-cell:nth-child(3),.os-cell:nth-child(4){border-bottom:none}
.os-lbl{font-size:11px;color:var(--sub);margin-bottom:4px}
.os-val{font-size:19px;font-weight:500}

/* ── Tab2 Position Card ── */
.pos-card{background:var(--card);border-radius:12px;overflow:hidden;margin-bottom:14px;border:.5px solid var(--border)}
.pos-hd{padding:10px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:.5px solid var(--border)}
.pos-hd.short{background:#FF3B3010}
.pos-hd.long{background:#34C75910}
.pos-hd-left{display:flex;flex-direction:column;gap:2px}
.pos-sym{font-size:16px;font-weight:500;color:var(--text)}
.pos-dir-tag{font-size:13px;margin-left:6px}
.pos-dir-tag.short{color:var(--red)}
.pos-dir-tag.long{color:var(--green)}
.pos-id-txt{font-size:11px;color:var(--hint)}
.strat-chip{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--stratbg);color:var(--strat);letter-spacing:.02em;white-space:nowrap;line-height:1.6}
.card.tcard{box-shadow:0 0 0 2.5px rgba(13,115,119,.6)}
.row.strat-row .rl{color:var(--strat);font-weight:600}
#p1-strategy{color:var(--strat);font-weight:600}
.state-badge{font-size:13px;font-weight:600;padding:5px 14px;border-radius:20px}
.badge-active{background:#E6F1FB;color:#0C447C}
.badge-partial{background:#FFF3E0;color:#854F0B}
.badge-closed{background:#FFD600;color:#7A5800}
.pos-g2{display:grid;grid-template-columns:1fr 1fr;gap:.5px;background:var(--border);border-bottom:.5px solid var(--border)}
.pos-stat{background:var(--card);padding:9px 14px}
.pos-slbl{font-size:11px;color:var(--sub);margin-bottom:2px}
.pos-sval{font-size:15px;font-weight:500;color:var(--text)}
.pos-sval.red{color:var(--red)}.pos-sval.green{color:var(--green)}.pos-sval.blue{color:var(--blue)}.pos-sval.acc{color:var(--acc)}.pos-sval.sub{color:var(--hint)}
.pos-row{display:flex;align-items:center;min-height:44px;padding:0 14px;border-bottom:.5px solid var(--border);font-size:14px}
.pos-row:last-child{border-bottom:none}
.pos-rl{flex:1;color:var(--sub)}
.pos-rv{font-weight:500;color:var(--text)}
.pos-rv.red{color:var(--red)}.pos-rv.orange{color:var(--orange)}.pos-rv.sub{color:var(--hint)}
.note-box{flex:1;background:var(--bg);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--sub);line-height:1.5;word-break:break-word}

.exit-section-hd{padding:7px 14px;background:rgba(13,115,119,.15);font-size:11px;font-weight:600;color:var(--acc);text-transform:uppercase;letter-spacing:.06em;border-top:.5px solid rgba(13,115,119,.2);border-bottom:.5px solid rgba(13,115,119,.2)}
.exit-rec-row{display:flex;align-items:center;min-height:44px;padding:0 14px;border-bottom:.5px solid var(--border);font-size:13px;gap:6px;cursor:pointer}
.exit-rec-row:last-child{border-bottom:none}
.exit-rec-row:active{background:var(--bg)}
.exit-date-val{font-size:11px;color:var(--sub);white-space:nowrap;flex-shrink:0;font-variant-numeric:tabular-nums}
/* exit-rec-row inline edit removed (replaced by bottom sheet) */
/* ── Tab3 expand panel ── */
.rec-tl{position:relative;padding-left:22px}
.rec-tl::before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:1.5px;background:var(--border)}
.rec-evt{position:relative;padding-bottom:12px}
.rec-evt:last-child{padding-bottom:2px}
.rec-dot{position:absolute;left:-19px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--card);border:2px solid var(--acc);box-sizing:border-box}
.rec-dot.win{border-color:var(--green)}
.rec-dot.loss{border-color:var(--red)}
.rec-elab{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:1px}
.rec-edate{font-size:11px;color:var(--sub);margin-bottom:3px;font-variant-numeric:tabular-nums}
.rec-erow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.rec-el{color:var(--sub)}
.rec-ev{font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}
.rec-2col{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.rec-box{background:var(--card);border-radius:10px;padding:10px 12px}
.rec-box-h{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.rec-brow{display:flex;justify-content:space-between;font-size:12px;padding:2px 0}
.rec-bl{color:var(--sub)}
.rec-bv{font-weight:500;font-variant-numeric:tabular-nums;color:var(--text)}
.rec-box-net{display:flex;justify-content:space-between;align-items:baseline;padding-top:6px;margin-top:4px;border-top:.5px solid var(--border)}
.rec-box-net-l{font-size:11px;font-weight:600;color:var(--text)}
.rec-box-net-v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.rec-note-sec{font-size:10px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 4px}
.exit-tag{width:28px;flex-shrink:0;font-weight:600;color:var(--acc);font-size:12px}
.exit-price-val{flex:1.2;font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.exit-price-val.profit{color:var(--green)}.exit-price-val.loss{color:var(--red)}
.exit-lot-val{flex:0.7;font-size:12px;color:var(--sub);text-align:center;font-variant-numeric:tabular-nums}
.exit-method-badge{flex:1;font-size:11px;color:var(--sub);background:var(--bg);padding:2px 6px;border-radius:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.exit-score-val{flex:0.5;font-size:11px;color:var(--acc);text-align:center}
.exit-pending-txt{color:var(--hint);font-style:italic;text-align:right;flex:1}
.add-exit-row{display:flex;align-items:center;min-height:44px;padding:0 14px;gap:8px;cursor:pointer;border-top:.5px solid var(--border)}
.add-exit-icon{width:24px;height:24px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;flex-shrink:0}
.add-exit-lbl{font-size:14px;color:var(--acc);font-weight:500}
.lot-status-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:.5px solid var(--border);transition:background .3s,border .3s}
.lot-status-lbl{font-size:12px;color:var(--sub);white-space:nowrap;flex-shrink:0}
.lot-status-disp{font-size:14px;font-weight:600;color:var(--text);flex:1;text-align:center}
.lot-status-msg{font-size:12px;font-weight:500;color:var(--sub);white-space:nowrap;flex-shrink:0}
.bd-section{padding:0 14px;border-top:.5px solid var(--border)}
.bd-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:.5px solid var(--border);font-size:14px}
.bd-row:last-child{border-bottom:none}
.bd-lbl{color:var(--sub)}
.bd-val{font-weight:500}
.pos-action-row{padding:10px 14px;background:var(--bg);border-top:.5px solid var(--border);display:flex;gap:8px}
.archive-btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:rgba(13,115,119,.12);color:var(--acc);transition:background .2s,color .2s}
.archive-btn.off{background:var(--bg);color:var(--hint);cursor:not-allowed}
.archive-btn.step1{background:var(--orange);color:#fff}
.archive-btn.step2{background:var(--acc);color:#fff}
.delete-btn{flex:0 0 44px;padding:11px;border:none;border-radius:10px;font-size:18px;cursor:pointer;background:rgba(255,59,48,.1);color:var(--red);display:flex;align-items:center;justify-content:center;transition:background .2s,color .2s}
.delete-btn.confirm{flex:0 0 110px;font-size:13px;font-weight:600;background:var(--red);color:#fff}

/* ── Add Exit Sheet ── */
.sheet-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:500}
.sheet-overlay.on{display:block}
.sheet{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(32px + env(safe-area-inset-bottom));z-index:501;max-height:90vh;overflow-y:auto}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet-title{font-size:16px;font-weight:500}
.sheet-close{width:28px;height:28px;border-radius:50%;background:var(--bg);border:none;font-size:18px;color:var(--sub);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-card{background:var(--bg);border-radius:12px;overflow:hidden;margin-bottom:10px}
.sheet-row{display:flex;align-items:center;min-height:46px;padding:0 14px;border-bottom:.5px solid var(--border);font-size:15px}
.sheet-row:last-child{border-bottom:none}
.sheet-rl{flex:1;color:var(--sub)}
.sheet-input{background:transparent;border:none;font-size:15px;font-weight:500;color:var(--blue);text-align:right;outline:none;font-family:inherit;width:140px}
.sheet-confirm-btn{width:100%;padding:14px;border:none;border-radius:12px;background:var(--acc);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px}
/* mockup-style fields for exit sheet (label above input) */
.sh-fld{margin-bottom:11px}
.sh-fld-l{font-size:12px;color:var(--sub);margin-bottom:5px;display:block}
.sh-inp{width:100%;height:42px;border:.5px solid var(--border);border-radius:10px;background:var(--bg);padding:0 13px;font-size:15px;color:var(--text);outline:none;font-family:inherit;-webkit-appearance:none}
.sh-inp:focus{border-color:var(--acc)}
.sh-row2{display:flex;gap:9px}.sh-row2 .sh-fld{flex:1}
.sh-row3{display:flex;gap:9px}.sh-row3 .sh-fld{flex:1}
.sh-fee-box{background:var(--bg);border-radius:10px;padding:11px 13px;margin:13px 0}
.sh-fee-row{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.sh-fee-l{color:var(--sub)}
.sh-fee-v{font-weight:500;font-variant-numeric:tabular-nums}
.sh-fee-div{height:.5px;background:var(--border);margin:6px 0}
.sh-net-row{display:flex;justify-content:space-between;font-size:15px;font-weight:600;padding:3px 0}
.sh-hint{font-size:11px;color:var(--hint);margin-top:4px}
.sh-lot-status{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:11px;font-weight:500;color:var(--sub)}
.sh-lot-status.ok #exit-lot-status-msg{color:var(--acc)}
.sh-lot-status.full #exit-lot-status-msg{color:var(--green)}
.sh-lot-status.over #exit-lot-status-msg{color:var(--red)}
.sh-full-link{font-size:11px;color:var(--acc);font-weight:500;cursor:pointer;-webkit-user-select:none;user-select:none;white-space:nowrap}
.sh-full-link:active{opacity:.5}

/* ── Trail SL Edit Sheet ── */
.trail-sheet{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:18px 18px 0 0;padding:16px 16px calc(32px + env(safe-area-inset-bottom));z-index:501;display:none}
.trail-sheet.on{display:block}
/* ── Cloud Sync ── */
.cloud-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:10px;font-size:12px;margin-bottom:10px}
.cloud-bar.synced{background:rgba(52,199,89,.08);color:#1B7F37}
.cloud-bar.pending{background:rgba(255,149,0,.08);color:#854F0B}
.cloud-bar.offline{background:var(--bg);color:var(--hint)}
.cloud-bar.error{background:rgba(255,59,48,.06);color:#A32D2D}
.cloud-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.cloud-dot.synced{background:#34C759}
.cloud-dot.pending{background:#FF9500}
.cloud-dot.offline{background:var(--hint)}
.cloud-dot.error{background:#FF3B30}
.sync-btn{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:13px;font-weight:500;text-align:center;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;-webkit-user-select:none;user-select:none}
.sync-btn:disabled{opacity:.5;cursor:not-allowed}
.sync-btn.push{background:var(--acc);color:#fff}
.sync-btn.pull{background:rgba(13,115,119,.12);color:var(--acc);border:1.5px solid rgba(13,115,119,.35)}

  <div class="tab-bar">

    <button class="tab-btn" id="tab-session" onclick="switchTab('session')">Position</button>
    <button class="tab-btn" id="tab-record" onclick="switchTab('record')">Record</button>
  </div>
</div>

<!-- TAB1: Calculator -->
<div id="page-calc" class="page on"></div>

<!-- TAB2: Session -->
<div id="page-session" class="page">

</div>

</div>

<!-- Manual pop-up -->

  <div class="manual-sheet" onclick="event.stopPropagation()">

      <span class="manual-x" onclick="closeManual()">✕</span>
    </div>
    <div class="manual-body" id="manual-body"></div>
  </div>
</div>

<!-- Import pop-up -->
<div class="manual-overlay" id="import-overlay" onclick="closeImport(event)">
  <div class="manual-sheet" onclick="event.stopPropagation()">
    <div class="manual-sheet-h">
      <div style="flex:1"><div class="manual-grab"></div><span style="font-size:16px;font-weight:600">Import Records</span></div>
      <span class="manual-x" onclick="closeImport()">✕</span>

      <label class="sh-fld-l">Lot</label>

      <label class="sh-fld-l">Score</label>
      <select class="sh-inp" id="exit-score">
        <option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>

  <div class="sh-row3">
    <div class="sh-fld">
      <label class="sh-fld-l">Swap</label>
      <input class="sh-inp" id="exit-swap" type="text" inputmode="decimal" placeholder="0 · pos = -7" oninput="updateExitPreview()" onblur="onPriceBlur(this);updateExitPreview()">
    </div>
    <div class="sh-fld">
      <label class="sh-fld-l">Com</label>
      <input class="sh-inp" id="exit-com" type="text" inputmode="decimal" placeholder="0" oninput="updateExitPreview()" onblur="onPriceBlur(this);updateExitPreview()">

      <label class="sh-fld-l">VAT</label>

  <div class="sh-fee-box" id="exit-fee-preview" style="display:none">
    <div class="sh-fee-row"><span class="sh-fee-l">Gross</span><span class="sh-fee-v" id="exfp-gross"></span></div>
    <div class="sh-fee-row"><span class="sh-fee-l">Swap</span><span class="sh-fee-v" id="exfp-swap"></span></div>
    <div class="sh-fee-row"><span class="sh-fee-l">Com</span><span class="sh-fee-v" id="exfp-com"></span></div>
    <div class="sh-fee-row"><span class="sh-fee-l">VAT</span><span class="sh-fee-v" id="exfp-vat"></span></div>
    <div class="sh-fee-div"></div>
    <div class="sh-net-row"><span>Net</span><span id="exfp-net" style="font-variant-numeric:tabular-nums"></span></div>
  </div>

<div class="trail-sheet" id="trail-sheet">

};</div>

// ── Canonical date parsing (single source of truth) ──
// string → {y,mo,d,h,mi,sec} | null. Accepts yyyy/mm/dd (year-first) & dd/mm/yy(yy) (day-first); sep / - . ; time after space/T/comma.
function parseDateParts(s){
  s=String(s||'').trim();if(!s)return null;let m;
  if((m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})(?:[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/)))
    return {y:+m[1],mo:+m[2],d:+m[3],h:+(m[4]||0),mi:+(m[5]||0),sec:+(m[6]||0)};
  if((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})(?:[\s,T]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/))){
    let y=+m[3];if(y<100)y+=2000;
    return {y,mo:+m[2],d:+m[1],h:+(m[4]||0),mi:+(m[5]||0),sec:+(m[6]||0)};
  }
  return null;
}
function stampMs(s){const p=parseDateParts(s);return p?new Date(p.y,p.mo-1,p.d,p.h,p.mi,p.sec).getTime():0;}
function recDateMs(r){
  const d=r.closedAt||r.archivedAt||(r.eval&&r.eval.exits&&r.eval.exits.length?r.eval.exits[r.eval.exits.length-1].date:'')||(r.source&&r.source.entry?r.source.entry.date:'')||'';
  return stampMs(d);
}
// returns [{t, cum}] sorted ascending by date (cumulative net P/L)
function cumulativeEquity(recs){
  const sorted=recs.slice().sort((a,b)=>recDateMs(a)-recDateMs(b));
  let cum=0;const out=[];
  sorted.forEach(r=>{cum+=(r.eval.realizedPL||0);out.push({t:recDateMs(r),cum});});
  return out;
}
// max peak-to-trough drop of a cumulative series (0 baseline = first high-water mark)
function maxDrawdown(series){
  let peak=0,maxDD=0;
  series.forEach(p=>{const v=p.cum;if(v>peak)peak=v;const dd=peak-v;if(dd>maxDD)maxDD=dd;});
  return maxDD;
}
const TH_MON=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
// nice round gridline values across [lo,hi]
function niceLevels(lo,hi,count){
  const range=(hi-lo)||1;let raw=range/count;
  const mag=Math.pow(10,Math.floor(Math.log10(raw)));const norm=raw/mag;
  let step=norm<1.5?1:norm<3?2:norm<7?5:10;step*=mag;
  const start=Math.ceil(lo/step)*step;const out=[];
  for(let v=start;v<=hi+step*1e-6;v+=step)out.push(Math.round(v*100)/100);
  return out;
}

function equityCurveSVG(recsFull){

  let pts=all;
  if(recPeriod!=='all'&&all.length){
    const endT=all[all.length-1].t;const days={'1m':30,'3m':90,'6m':180}[recPeriod];
    pts=all.filter(p=>p.t>=endT-days*86400000);
  }
  const lastCum=all.length?all[all.length-1].cum:0;
  const vColor=lastCum>0?'var(--green)':lastCum<0?'var(--red)':'var(--text)';
  const head=`<div style="display:flex;justify-content:space-between;align-items:baseline;padding:13px 15px 4px"><span style="font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:600">Equity Curve</span><span style="font-size:18px;font-weight:700;color:${vColor}">${fSign(lastCum,2)}</span></div>`;
  let chart;

    chart=`<div style="height:120px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--hint)">ต้องมีอย่างน้อย 2 ไม้ในช่วงนี้</div>`;
  }else{
    const X0=34,X1=356,Y0=14,Y1=116;
    const cums=pts.map(p=>p.cum);
    let lo=Math.min(...cums),hi=Math.max(...cums);
    if(recPeriod==='all'){lo=Math.min(0,lo);hi=Math.max(0,hi);}
    if(lo===hi){lo-=1;hi+=1;}
    const padv=(hi-lo)*0.12;lo-=padv;hi+=padv;
    const startT=pts[0].t,endT=pts[pts.length-1].t;
    const tx=t=>X0+(endT>startT?(t-startT)/(endT-startT):0)*(X1-X0);
    const vy=v=>Y1-(v-lo)/(hi-lo)*(Y1-Y0);
    const ylv=niceLevels(lo,hi,4);
    const grid=ylv.map(v=>{const y=vy(v);if(y<Y0-1||y>Y1+1)return'';const dash=Math.abs(v)<1e-9?' stroke-dasharray="3 3"':'';const lbl=Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':String(Math.round(v));return `<line x1="${X0}" y1="${y.toFixed(1)}" x2="${X1}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" opacity=".4"${dash}/><text x="${(X0-4).toFixed(0)}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--hint)">${lbl}</text>`;}).join('');
    const spanDays=(endT-startT)/86400000;let xb=[];
    if(spanDays<=45){for(let i=1;;i++){const tt=startT+i*7*86400000;if(tt>=endT)break;xb.push(tt);}}
    else{let d=new Date(startT);let cur=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();while(cur<endT){xb.push(cur);cur=new Date(new Date(cur).getFullYear(),new Date(cur).getMonth()+1,1).getTime();}}
    const xgrid=xb.map(tt=>`<line x1="${tx(tt).toFixed(1)}" y1="${Y0}" x2="${tx(tt).toFixed(1)}" y2="${Y1}" stroke="var(--border)" stroke-width="1" opacity=".45"/>`).join('');
    let xlabels='';
    if(spanDays<=45){xlabels=xb.map(tt=>{const dt=new Date(tt);return `<text x="${tx(tt).toFixed(1)}" y="132" text-anchor="middle" font-size="9" fill="var(--hint)">${dt.getDate()}/${dt.getMonth()+1}</text>`;}).join('');}
    else{const bounds=[startT,...xb,endT];for(let i=0;i<bounds.length-1;i++){const mid=(bounds[i]+bounds[i+1])/2;const mon=new Date(bounds[i]).getMonth();xlabels+=`<text x="${tx(mid).toFixed(1)}" y="132" text-anchor="middle" font-size="9" fill="var(--hint)">${TH_MON[mon]}</text>`;}}
    const line=pts.map((p,i)=>(i?'L':'M')+tx(p.t).toFixed(1)+','+vy(p.cum).toFixed(1)).join(' ');
    const area=line+` L${tx(endT).toFixed(1)},${Y1} L${tx(startT).toFixed(1)},${Y1} Z`;
    chart=`<svg style="display:block;width:100%;height:150px" viewBox="0 0 360 150" preserveAspectRatio="none">
      <defs><linearGradient id="eqfill" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0D7377" stop-opacity="0.20"/><stop offset="100%" stop-color="#0D7377" stop-opacity="0"/></linearGradient></defs>
      ${grid}${xgrid}${xlabels}
      <path d="${area}" fill="url(#eqfill)"/>
      <path d="${line}" fill="none" stroke="#0D7377" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${tx(endT).toFixed(1)}" cy="${vy(pts[pts.length-1].cum).toFixed(1)}" r="3.5" fill="#0D7377"/>
    </svg>`;
  }
  return `<div class="card">${head}${sel}${chart}<div style="text-align:center;padding:2px 15px 12px;font-size:11px;color:var(--hint)">cumulative net P/L</div></div>`;
}

function userRecordsRef(){
  if(!fbUser||!fbDb)return null;
  return fbDb.collection('users').doc(fbUser.uid).collection('records');

async function pushToCloud(){
  if(!fbUser||!fbDb||isSyncing)return;
  isSyncing=true; cloudStatus='pending'; cloudMsg='กำลัง Push...';
  renderRecords();
  try{
    const local=loadRecords();
    const ref=userRecordsRef();
    // read existing cloud IDs
    const snap=await ref.get();
    const cloudIds=new Set();
    snap.forEach(doc=>cloudIds.add(doc.id));
    // push local records not on cloud
    let added=0, skipped=0, invalid=0;
    const batch_size=500; // Firestore batch limit
    let batch=fbDb.batch();
    let batchCount=0;
    for(const rec of local.records){
      if(!isValidRecord(rec)){invalid++;continue;}
      if(cloudIds.has(rec.id)){
        skipped++;
      }else{
        batch.set(ref.doc(rec.id),JSON.parse(JSON.stringify(rec)));
        added++;
        batchCount++;
        if(batchCount>=batch_size){
          await batch.commit();
          batch=fbDb.batch();
          batchCount=0;
        }
      }
    }
    if(batchCount>0) await batch.commit();
    cloudLastSync=new Date();
    cloudStatus='synced';
    cloudMsg=`Push เสร็จ · +${added} added · ${skipped} skipped${invalid?' · '+invalid+' invalid':''}`;
    renderRecords();
    setTimeout(()=>{
      if(cloudStatus==='synced'){
        cloudMsg=`Synced · ${local.records.length} records · ${fmtSyncTime(cloudLastSync)}`;
        renderRecords();
      }
    },3000);
  }catch(e){
    cloudStatus='error'; cloudMsg='Push ล้มเหลว: '+e.message;
    console.error('Push error:',e);
    renderRecords();
  }finally{ isSyncing=false; }
}

async function pullFromCloud(){
  if(!fbUser||!fbDb||isSyncing)return;
  isSyncing=true; cloudStatus='pending'; cloudMsg='กำลัง Pull...';
  renderRecords();
  try{
    const ref=userRecordsRef();
    const snap=await ref.get();
    const cloudRecs=[];
    snap.forEach(doc=>cloudRecs.push(doc.data()));
    const local=loadRecords();
    const localIds=new Set(local.records.map(r=>r.id));
    let added=0, skipped=0, invalid=0;
    for(const rec of cloudRecs){
      if(!isValidRecord(rec)){invalid++;continue;}
      if(localIds.has(rec.id)){
        skipped++;
      }else{
        local.records.push(rec);
        localIds.add(rec.id);
        added++;
      }
    }
    const saved=saveRecords(local);
    if(!saved){
      cloudStatus='error';
      cloudMsg='Pull ล้มเหลว: เก็บ local ไม่ได้ (storage เต็ม?)';
      renderRecords();
      return;
    }
    cloudLastSync=new Date();
    cloudStatus='synced';
    cloudMsg=`Pull เสร็จ · +${added} added · ${skipped} already had${invalid?' · '+invalid+' invalid':''}`;
    renderRecords();
    setTimeout(()=>{
      if(cloudStatus==='synced'){
        cloudMsg=`Synced · ${local.records.length} records · ${fmtSyncTime(cloudLastSync)}`;
        renderRecords();
      }
    },3000);
  }catch(e){
    cloudStatus='error'; cloudMsg='Pull ล้มเหลว: '+e.message;
    console.error('Pull error:',e);
    renderRecords();
  }finally{ isSyncing=false; }
}

function isValidRecord(rec){
  return !!(rec
    && typeof rec.id==='string' && rec.id

    && Array.isArray(rec.eval.exits));

function fmtSyncTime(d){
  if(!d)return '';
  const now=new Date();
  const diff=Math.floor((now-d)/1000);
  if(diff<60)return 'เมื่อกี้';
  if(diff<3600)return Math.floor(diff/60)+' min ago';
  if(diff<86400)return Math.floor(diff/3600)+' hr ago';
  return d.toLocaleDateString('th');
}

function calcRisk(n){
  const sym=getSymbol(g(`p${n}-inst`).value);
  const unit=sym.unit;const pipM=sym.pipM;
  if(!unit){['rc-slpct','rc-slpips','rc-sldist','rc-cv','rc-margin','rc-lot'].forEach(k=>{const el=g(`p${n}-${k}`);if(el)el.textContent='—';});return;}
  const entry=parseNum(g(`p${n}-entry`).value)||0;
  const ids=['rc-slpct','rc-slpips','rc-sldist','rc-cv','rc-margin','rc-lot'];
  const clear=()=>ids.forEach(k=>{const el=g(`p${n}-${k}`);if(el)el.textContent='—';});
  if(!entry){clear();return;}
  const dir=g(`p${n}-dir`).value;const sign=dir==='long'?1:-1;
  if(riskMode[n]==='margin'){
    const mgn=parseFloat(g(`p${n}-margin-in`).value)||0;
    const lev=parseFloat(g(`p${n}-lev`).value)||0;
    if(!mgn||!lev){clear();return;}
    const cvm=mgn*lev;const lotm=cvm/(unit*entry);
    const slm=parseNum(g(`p${n}-sl`).value)||0;
    if(slm){
      const slDistM=Math.abs(entry-slm);
      const slPctM=entry>0?((slDistM/entry)*100):0;
      g(`p${n}-rc-slpct`).textContent=f(slPctM,2)+'%';
      g(`p${n}-rc-slpips`).textContent=f(slDistM*pipM,1)+' pip';
      g(`p${n}-rc-sldist`).textContent=f(slDistM,5);
    }else{
      ['rc-slpct','rc-slpips','rc-sldist'].forEach(k=>{const el=g(`p${n}-${k}`);if(el)el.textContent='—';});
    }
    g(`p${n}-rc-cv`).textContent='$'+f(cvm);
    g(`p${n}-rc-margin`).textContent='$'+f(cvm/lev);
    g(`p${n}-rc-lot`).textContent=f(lotm,3)+' lot';
    return;
  }
  let slDist=0,rpt=0;
  if(riskMode[n]==='fixed'){
    const sl=parseNum(g(`p${n}-sl`).value)||0;
    rpt=parseFloat(g(`p${n}-rpt`).value)||0;
    if(!sl||!rpt){clear();return;}
    slDist=Math.abs(entry-sl);
  }else{
    const sdPct=parseFloat(g(`p${n}-vsd`).value)||0;
    const sf=parseFloat(g(`p${n}-vsf`).value)||0;
    rpt=parseFloat(g(`p${n}-rpt`).value)||0;
    if(!sdPct||!sf||!rpt){clear();return;}
    slDist=entry*(sdPct/100)*sf;
    const slPrice=(entry-sign*slDist).toFixed(5);
    const slAutoEl=g(`p${n}-sl-auto`);if(slAutoEl)slAutoEl.textContent=slPrice;
    const slEl=g(`p${n}-sl`);if(slEl)slEl.value=slPrice;
  }
  if(!slDist){clear();return;}
  const cv=rpt/slDist;const lot=cv/(unit*entry);
  const slPct=entry>0?((slDist/entry)*100):0;
  const slPctEl=g(`p${n}-rc-slpct`);if(slPctEl)slPctEl.textContent=f(slPct,2)+'%';
  const slPipsEl=g(`p${n}-rc-slpips`);if(slPipsEl)slPipsEl.textContent=f(slDist*pipM,1)+' pip';
  const slDistEl=g(`p${n}-rc-sldist`);if(slDistEl)slDistEl.textContent=f(slDist,5);
  g(`p${n}-rc-cv`).textContent='$'+f(cv);
  const levR=parseFloat(g(`p${n}-lev`).value)||0;
  g(`p${n}-rc-margin`).textContent=levR>0?'$'+f(cv/levR):'—';
  g(`p${n}-rc-lot`).textContent=f(lot,3)+' lot';
}
function applyLot(n){
  const lotTxt=g(`p${n}-rc-lot`).textContent;
  if(!lotTxt||lotTxt==='—')return;
  const num=parseFloat(lotTxt);if(!isFinite(num))return;  g(`p${n}-lot`).value=(Math.floor(num*100)/100).toFixed(2);

function calcPos(n){
  const sym=getSymbol(g(`p${n}-inst`).value);
  const unit=sym.unit||100000;const pipM=sym.pipM||10000;
  const bal=parseNum(g('balance')?.value)||0;
  const lev=parseFloat(g(`p${n}-lev`).value)||25;
  const dir=g(`p${n}-dir`).value;const sign=dir==='long'?1:-1;

  const sl=parseNum(g(`p${n}-sl`).value)||0;
  const lot=parseFloat(g(`p${n}-lot`).value)||0;
  const cv=lot*unit*entry;
  const margin=lev>0&&entry>0?cv/lev:0;
  const mlevel=margin>0&&bal>0?(bal/margin)*100:0;
  const slDist=Math.abs(entry-sl);
  const risk=slDist*unit*lot;
  const mg=g(`p${n}-margin`);if(mg)mg.textContent=margin?'$'+f(margin):'—';
  const le=g(`p${n}-level`);if(le){le.textContent=mlevel?f(mlevel,1)+'%':'—';le.className='os-val '+(mlevel<100?'cr':mlevel<200?'co':mlevel<500?'':'cg');}
  const rke=g(`p${n}-risk`);if(rke)rke.textContent=risk?'$'+f(risk):'—';
  const cve=g(`p${n}-cv`);if(cve)cve.textContent=cv?'$'+f(cv,0):'—';
  const slPct=entry>0&&slDist>0?(slDist/entry)*100:0;
  const osp=g(`p${n}-os-slpct`);if(osp)osp.textContent=slPct?f(slPct,2)+'%':'—';
  const oss=g(`p${n}-os-slpips`);if(oss)oss.textContent=slDist?f(slDist*pipM,1)+' pip':'—';
  calcRisk(n);
  saveDataDebounced();
}

function computePos(pos){
  const sym=getSymbol(pos.entry.inst);
  const unit=sym.unit||100000;const pipM=sym.pipM||10000;
  const entry=parseFloat(pos.entry.price)||0;
  const usedLot=parseFloat(pos.entry.usedLot)||0;
  const lev=parseFloat(pos.entry.lev)||25;
  const dir=pos.entry.dir;const sign=dir==='long'?1:-1;
  const sl=parseFloat(pos.entry.sl)||0;
  const cv=usedLot*unit*entry;
  const margin=lev>0&&entry>0?cv/lev:0;
  const bal=parseNum(g('balance')?.value)||10000;
  const mlevel=margin>0?((bal)/margin)*100:0;
  const slDist=Math.abs(entry-sl);
  const risk=slDist*unit*usedLot;
  const exits=Object.entries(pos.exit)
    .filter(([k])=>k!=='trailSL'&&k!=='note')
    .map(([,v])=>({price:parseFloat(v?.price)||0,lot:parseFloat(v?.lot)||0,
                   swap:parseNum(v?.swap)||0,com:parseNum(v?.com)||0,vat:parseNum(v?.vat)||0}));
  let realizedPL=0,totalExitLot=0,hasRealized=false;
  let totalSwap=0,totalCom=0,totalVat=0,hasFees=false;
  exits.forEach(({price,lot,swap,com,vat})=>{
    if(price&&lot){realizedPL+=(price-entry)*sign*unit*lot;totalExitLot+=lot;hasRealized=true;}
    if(swap||com||vat){totalSwap+=swap;totalCom+=com;totalVat+=vat;hasFees=true;}
  });
  const totalFees=totalSwap+totalCom+totalVat;
  const netPL=realizedPL-totalFees;
  const remainingLot=Math.max(usedLot-totalExitLot,0);
  const trailSL=parseFloat(pos.exit.trailSL)||0;
  const trailSLD=trailSL&&entry?Math.abs(entry-trailSL):0;
  const trailSLDPips=trailSLD*pipM;
  // holding period
  let holdingStr='—';
  if(pos.meta.importedAt){
    const parts=pos.meta.importedAt.split(' ');
    const dp=parts[0].split('/');const tp=(parts[1]||'00:00:00').split(':');
    const importDate=new Date(+('20'+dp[2]),+dp[1]-1,+dp[0],+tp[0],+tp[1],+tp[2]||0);
    const diffMs=Date.now()-importDate.getTime();
    const diffD=Math.floor(diffMs/86400000);
    const diffH=Math.floor((diffMs%86400000)/3600000);
    holdingStr=diffD>0?`${diffD}d ${diffH}h`:`${diffH}h`;
  }
  // state
  let state=pos.meta.state;
  if(totalExitLot>=usedLot-0.001&&totalExitLot>0)state='CLOSED';
  else if(totalExitLot>0)state='PARTIAL';
  else state='ACTIVE';
  const rr=risk>0?realizedPL/risk:0;
  return{unit,pipM,entry,usedLot,lev,dir,sign,cv,margin,mlevel,slDist,risk,
    realizedPL,totalExitLot,remainingLot,hasRealized,trailSL,trailSLD,trailSLDPips,
    totalSwap,totalCom,totalVat,totalFees,netPL,hasFees,
    holdingStr,state,rr};
}

function lotStatusMsg(totalExitLot,usedLot){
  if(usedLot>0&&totalExitLot>usedLot+0.001)return '⚠ Exceeded by '+f(totalExitLot-usedLot,2)+' lot';
  if(usedLot>0&&Math.abs(usedLot-totalExitLot)<0.001)return '✓ Full';
  return 'Available: '+f(Math.max(usedLot-totalExitLot,0),2)+' lot';
}
function updateLotBar(posId,totalExitLot,usedLot){
  const bar=document.getElementById('lot-bar-'+posId);
  const disp=document.getElementById('lot-disp-'+posId);
  const msg=document.getElementById('lot-msg-'+posId);
  if(!bar)return;
  const avail=usedLot-totalExitLot;
  const over=usedLot>0&&totalExitLot>usedLot+0.001;
  const full=usedLot>0&&Math.abs(avail)<0.001;
  const partial=usedLot>0&&totalExitLot>0.001&&!full&&!over;
  disp.textContent=f(totalExitLot,2)+' / '+f(usedLot,2)+' lot';
  if(over){
    bar.style.cssText='background:rgba(255,59,48,.06);border-bottom:.5px solid rgba(255,59,48,.4)';
    [bar.querySelector('.lot-status-lbl'),disp,msg].forEach(el=>{if(el)el.style.color='var(--red)'});
    msg.textContent='⚠ Exceeded by '+f(totalExitLot-usedLot,2)+' lot';
    msg.style.cssText='font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;color:var(--red)';
  }else if(full){
    bar.style.cssText='background:rgba(0,122,255,.1);border-bottom:.5px solid rgba(0,122,255,.4)';
    bar.querySelector('.lot-status-lbl').style.color='var(--blue)';
    disp.style.color='var(--blue)';
    msg.style.cssText='font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap;background:#34C759;color:#fff;flex-shrink:0';
    msg.textContent='✓ Full';
  }else if(partial){
    bar.style.cssText='background:rgba(0,0,0,.3);border-bottom:.5px solid rgba(255,255,255,.15)';
    [bar.querySelector('.lot-status-lbl'),disp,msg].forEach(el=>{if(el)el.style.color='var(--blue)'});
    msg.textContent='Available: '+f(Math.max(avail,0),2)+' lot';
  }else{
    bar.style.cssText='background:rgba(0,0,0,.3);border-bottom:.5px solid rgba(255,255,255,.15)';
    bar.querySelector('.lot-status-lbl').style.color='rgba(255,255,255,.4)';
    disp.style.color='rgba(255,255,255,.5)';
    msg.style.cssText='font-size:12px;color:rgba(255,255,255,.35);white-space:nowrap;flex-shrink:0';
    msg.textContent='Available: '+f(Math.max(avail,0),2)+' lot';
  }
}

// ── Exit fees: live preview & helpers ─────────────────
// Net = Gross − Swap − Com − VAT (pos swap = -7 → adds back; com/vat positive = deduct)
function feeNet(gross, swap, com, vat){
  return (gross||0) - (parseNum(swap)||0) - (parseNum(com)||0) - (parseNum(vat)||0);
}
function fmtSigned(n,d){
  d=d==null?2:d;
  if(!isFinite(n))return '—';
  const s=n.toFixed(d);
  return n>0?('+'+s):s;
}
function updateExitPreview(){
  updateExitLotBar();
  const box=g('exit-fee-preview');if(!box)return;
  const price=parseNum(g('exit-price').value);
  const lot=parseNum(g('exit-lot').value);
  const swap=parseNum(g('exit-swap').value);
  const com=parseNum(g('exit-com').value);
  const vat=parseNum(g('exit-vat').value);
  // need entry context for gross calc
  if(!currentExitPosId||!isFinite(price)||!isFinite(lot)){box.style.display='none';return;}
  const data=loadSession();
  const pos=data.positions.find(p=>p.id===currentExitPosId);
  if(!pos){box.style.display='none';return;}
  const sym=getSymbol(pos.entry.inst);
  const unit=sym?sym.unit:0;
  const entry=parseNum(pos.entry.price);
  const sign=pos.entry.dir==='long'?1:-1;
  const gross=(price-entry)*sign*unit*lot;
  const net=gross-(isFinite(swap)?swap:0)-(isFinite(com)?com:0)-(isFinite(vat)?vat:0);
  box.style.display='block';
  g('exfp-gross').textContent=fmtSigned(gross);
  g('exfp-gross').style.color=gross>0?'var(--green)':(gross<0?'var(--red)':'');
  // swap: stored value -7 means pos swap (got money back) → display as +7 green
  const swapShown=isFinite(swap)?-swap:0;
  g('exfp-swap').textContent=isFinite(swap)?fmtSigned(swapShown):'0.00';
  g('exfp-swap').style.color=swapShown>0?'var(--green)':(swapShown<0?'var(--sub)':'');
  g('exfp-com').textContent=isFinite(com)&&com!==0?('−'+Math.abs(com).toFixed(2)):'0.00';
  g('exfp-com').style.color=com>0?'var(--sub)':'';
  g('exfp-vat').textContent=isFinite(vat)&&vat!==0?('−'+Math.abs(vat).toFixed(2)):'0.00';
  g('exfp-vat').style.color=vat>0?'var(--sub)':'';
  g('exfp-net').textContent=fmtSigned(net);
  g('exfp-net').style.color=net>0?'var(--green)':(net<0?'var(--red)':'');
}
function updateExitLotBar(){
  const wrap=g('exit-lot-status');const msgEl=g('exit-lot-status-msg');const link=g('exit-full-link');
  if(!wrap||!msgEl||!currentExitPosId){if(wrap)wrap.style.display='none';return;}
  const data=loadSession();
  const pos=data.positions.find(p=>p.id===currentExitPosId);
  if(!pos){wrap.style.display='none';return;}
  const c=computePos(pos);
  // exclude current slot's existing lot (since user is editing it now)
  const currentSlot=(g('exit-slot').value||'').trim().toLowerCase().replace(/\s+/g,'');
  const existingLot=currentSlot&&pos.exit[currentSlot]?parseFloat(pos.exit[currentSlot].lot)||0:0;
  const pendingLot=parseNum(g('exit-lot').value)||0;
  const totalExit=c.totalExitLot-existingLot+pendingLot;
  const msg=lotStatusMsg(totalExit,c.usedLot);
  msgEl.textContent=msg;
  wrap.style.display='flex';
  wrap.classList.remove('ok','full','over');
  if(msg.startsWith('⚠'))wrap.classList.add('over');
  else if(msg.startsWith('✓'))wrap.classList.add('full');
  else wrap.classList.add('ok');
  // show Use full link only for CL slot with remaining
  if(link){
    const remaining=Math.max(c.usedLot-c.totalExitLot+existingLot,0);
    if(currentSlot==='cl'&&remaining>0.001){
      link.textContent='Use full ('+f(remaining,2)+') →';
      link.style.display='inline-block';
    }else{
      link.style.display='none';
    }
  }
}

function archivePos(posId){
  const btn=document.querySelector(`[data-archive-id="${posId}"]`);
  if(!btn)return;
  const step=btn.dataset.step||'0';
  if(step==='0'){
    // check lot exceeded
    const data=loadSession();
    const pos=data.positions.find(p=>p.id===posId);
    if(pos){
      const c=computePos(pos);
      if(c.totalExitLot>c.usedLot+0.001){
        btn.textContent='Exceeded lot';
        btn.style.background='var(--red)';btn.style.color='#fff';
        clearTimeout(btn._t);
        btn._t=setTimeout(()=>{
          btn.textContent='Archive';
          btn.style.background='';btn.style.color='';
        },2500);
        return;
      }
    }
    btn.textContent='Export';btn.classList.add('step1');btn.dataset.step='1';
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>resetArchiveBtn(btn),2500);
  }else if(step==='1'){
    btn.textContent='ยืนยัน Export';btn.classList.remove('step1');btn.classList.add('step2');btn.dataset.step='2';
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>resetArchiveBtn(btn),2500);
  }else{
    resetArchiveBtn(btn);
    const data=loadSession();
    const pos=data.positions.find(p=>p.id===posId);
    if(!pos)return;
    // freeze close time, commit to permanent Record store, then remove from session
    pos.meta.closedAt=nowStamp();
    pos.meta.state='CLOSED';
    addRecord(pos);
    data.positions=data.positions.filter(p=>p.id!==posId);
    saveSession(data);
    renderSession();
  }
}
function resetArchiveBtn(btn){
  btn.textContent='Archive';
  btn.classList.remove('step1','step2');

  clearTimeout(btn._t);
}
// ─── CTD.Record — data layer ──────────────────────────
function loadRecords(){
  try{const raw=localStorage.getItem(SK3);const d=raw?JSON.parse(raw):{version:'r1',records:[]};if(d.exportedCount==null)d.exportedCount=0;return d;}
  catch(e){return{version:'r1',records:[],exportedCount:0};}
}
function saveRecords(data){
  try{localStorage.setItem(SK3,JSON.stringify(data));return true;}
  catch(e){console.error('saveRecords failed:',e);return false;}
}
// build a frozen, asset-agnostic record entry from a position
function buildRecord(pos){
  const c=computePos(pos);
  const slots=['cl','t1','t2','t3'];
  const extraSlots=Object.keys(pos.exit).filter(k=>!['trailSL','note','cl','t1','t2','t3'].includes(k));
  const allSlots=[...slots,...extraSlots];
  const exits=[];let scoreSum=0,scoreN=0;
  allSlots.forEach(slot=>{
    const ex=pos.exit[slot];
    if(!ex||!ex.price)return;
    const xPrice=parseFloat(ex.price)||0;const xLot=parseFloat(ex.lot)||0;
    const xSwap=parseNum(ex.swap)||0;const xCom=parseNum(ex.com)||0;const xVat=parseNum(ex.vat)||0;
    const gross=(xPrice-c.entry)*c.sign*c.unit*xLot;
    const net=gross-xSwap-xCom-xVat;
    if(ex.score!==''&&ex.score!=null&&isFinite(+ex.score)){scoreSum+=+ex.score;scoreN++;}
    exits.push({slot,price:ex.price,date:ex.date||'',lot:ex.lot,method:ex.method||'',score:ex.score||'',
      swap:ex.swap||'',com:ex.com||'',vat:ex.vat||'',
      gross:+gross.toFixed(2),pl:+net.toFixed(2)});  // pl = net (Phase 7B); gross kept separately
  });
  // realizedPL = NET (Phase 7B) · grossPL kept alongside for transparency
  const netPL=c.netPL;
  const outcome=netPL>0.0001?'win':netPL<-0.0001?'loss':'breakeven';
  const rMultipleNet=c.risk>0?netPL/c.risk:0;
  return {
    recVer:'r1',
    id:pos.id,
    archivedAt:pos.meta.closedAt||nowStamp(),
    openedAt:pos.meta.importedAt||'',
    closedAt:pos.meta.closedAt||'',
    source:JSON.parse(JSON.stringify(pos)),   // raw packet (replay/audit)
    eval:{
      // ── asset-agnostic core ──
      symbol:pos.entry.inst,
      strategy:pos.entry.strategy||'',
      direction:pos.entry.dir,
      entryPrice:c.entry,
      entrySL:parseFloat(pos.entry.sl)||0,
      exits,
      riskAmount:+c.risk.toFixed(2),
      realizedPL:+netPL.toFixed(2),       // net (after fees) — Phase 7B
      grossPL:+c.realizedPL.toFixed(2),   // gross (before fees) — kept for transparency
      totalFees:+c.totalFees.toFixed(2),
      totalSwap:+c.totalSwap.toFixed(2),
      totalCom:+c.totalCom.toFixed(2),
      totalVat:+c.totalVat.toFixed(2),
      rMultiple:+rMultipleNet.toFixed(3),
      outcome,
      totalExitLot:+c.totalExitLot.toFixed(2),
      avgExitScore:scoreN?+(scoreSum/scoreN).toFixed(2):null,
      holdingStr:c.holdingStr,
      entryScore:pos.entry.entryScore||'',
      entryNote:pos.entry.entryNote||'',
      exitNote:pos.exit.note||'',
      // ── Fx extension ──
      ext:{
        usedLot:parseFloat(pos.entry.usedLot)||0,
        usedCV:+c.cv.toFixed(2),
        lev:parseFloat(pos.entry.lev)||0,
        sld:parseFloat(pos.entry.sld)||c.slDist,
        riskMode:pos.entry.rmode||'',
        rpt:pos.entry.rpt||'',
        vola:pos.entry.vsd||'',
        sf:pos.entry.vsf||''
      }
    }
  };
}
function addRecord(pos){
  const data=loadRecords();
  let rec=buildRecord(pos);
  // dup id guard (defensive — re-archive of same id)
  if(data.records.some(r=>r.id===rec.id)){
    let n=2;let base=rec.id;
    while(data.records.some(r=>r.id===`${base}-${n}`))n++;
    rec.id=`${base}-${n}`;
  }
  data.records.push(rec);

function csvCell(v){

function toISODate(s){

  return `${2000+(+m[3])}-${m[2]}-${m[1]} ${(m[4]||'00').padStart(2,'0')}:${m[5]||'00'}:${m[6]||'00'}`;
}

function downloadBlob(blob,filename){

    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=filename;a.style.display='none';
    document.body.appendChild(a);
    a.click();

}

function normStamp(s){const p=parseDateParts(s);if(!p)return String(s||'').trim();const z=v=>String(v).padStart(2,'0');return `${z(p.d)}/${z(p.mo)}/${String(p.y).slice(2)} ${z(p.h)}:${z(p.mi)}:${z(p.sec)}`;}
function holdingBetween(a,b){const pa=stampMs(a),pb=stampMs(b);if(!pa||!pb||pb<pa)return '—';const ms=pb-pa,d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000);return d>0?`${d}d ${h}h`:`${h}h`;}
function makeImportId(inst,dir,dateStr){const ds=dir==='short'?'S':'L';const p=parseDateParts(dateStr);const z=v=>String(v).padStart(2,'0');const ddmmyy=p?z(p.d)+z(p.mo)+String(p.y).slice(2):'000000';const hhmm=p?z(p.h)+z(p.mi):'0000';return `${String(inst).toUpperCase()}.O.${ds}.${ddmmyy}.${hhmm}`;}
function parseImportCSV(text){
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else q=false;}else cur+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(cur);cur='';}else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!=='\r')cur+=c;}
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row);}
  return rows;
}
function importSlot(cells,base){
  const price=(cells[base+1]||'').trim();if(!price)return null;
  return {date:normStamp(cells[base]),price,lot:(cells[base+2]||'').trim(),method:(cells[base+3]||'').trim(),
    score:(cells[base+4]||'').trim(),swap:(cells[base+5]||'').trim(),com:(cells[base+6]||'').trim(),vat:(cells[base+7]||'').trim()};
}
function posFromImportRow(cells){
  const get=i=>(cells[i]||'').trim();
  const inst=get(1).toUpperCase();
  if(!inst)return {err:'ไม่มี Symbol'};
  const sym=SYMBOLS[inst];
  if(!sym||sym.unit==null)return {err:`Symbol ไม่รู้จัก: ${inst}`};
  if(!get(5))return {err:'ไม่มี Entry'};
  if(!get(4))return {err:'ไม่มี Entry Date'};
  const dir=get(3).toLowerCase()==='short'?'short':'long';
  const exit={trailSL:'',note:get(15)};let hasExit=false,lastDate='';
  [['cl',16],['t1',24],['t2',32],['t3',40]].forEach(([k,b])=>{
    const s=importSlot(cells,b);
    exit[k]=s||{price:'',date:'',method:'',lot:'',score:'',swap:'',com:'',vat:''};
    if(s&&s.lot){hasExit=true;if(stampMs(s.date)>stampMs(lastDate))lastDate=s.date;}
  });
  if(!hasExit)return {err:'ไม่มี exit (ยังไม่ปิด)'};
  const entryN=parseNum(get(5))||0,slN=parseNum(get(6))||0,lot=parseFloat(get(7))||0,lev=parseFloat(get(8))||25;
  const vsd=get(11),vsf=get(12);
  const sld=entryN>0&&vsd?entryN*(parseFloat(vsd)/100)*(parseFloat(vsf)||1):Math.abs(entryN-slN);
  const eStamp=normStamp(get(4));
  const id=get(0)||makeImportId(inst,dir,get(4));
  return {pos:{version:'v1',id,meta:{state:'CLOSED',importedAt:eStamp,closedAt:lastDate},
    entry:{date:eStamp,inst,dir,strategy:get(2),price:String(entryN),sl:String(slN),rmode:get(9),rpt:get(10),
      vsd,vsf,sld:String(sld.toFixed(2)),usedLot:String(lot),usedCV:String((lot*sym.unit*entryN).toFixed(0)),
      lev:String(lev),entryScore:get(13),entryNote:get(14)},
    exit},eStamp,lastDate};
}
function runImport(){
  const ta=g('import-text'),res=g('import-result');
  const text=ta?ta.value:'';
  if(!text.trim()){res.innerHTML='<span style="color:var(--red)">วางข้อมูล CSV ก่อน</span>';return;}
  const rows=parseImportCSV(text);
  const hi=rows.findIndex(r=>r.map(x=>(x||'').trim()).includes('Symbol'));
  if(hi<0){res.innerHTML='<span style="color:var(--red)">ไม่พบหัวตาราง (คอลัมน์ Symbol) — ใช้ template ถูกไหม?</span>';return;}
  const dataRows=rows.slice(hi+1).filter(r=>r.some(c=>(c||'').trim()!==''));
  const data=loadRecords();const existing=new Set(data.records.map(r=>r.id));
  let added=0,skipped=0;const errs=[];
  dataRows.forEach((cells,idx)=>{
    const out=posFromImportRow(cells);
    if(out.err){errs.push(`แถว ${idx+1}: ${out.err}`);return;}
    let rec;try{rec=buildRecord(out.pos);}catch(e){errs.push(`แถว ${idx+1}: คำนวณไม่ได้`);return;}
    rec.eval.holdingStr=holdingBetween(out.eStamp,out.lastDate);
    if(existing.has(rec.id)){skipped++;return;}
    data.records.push(rec);existing.add(rec.id);added++;
  });
  if(added>0)saveRecords(data);
  renderRecords();
  let msg=`<div style="font-weight:700;color:var(--green);font-size:16px">+${added} เพิ่ม</div>`;
  if(skipped)msg+=`<div style="color:var(--sub);margin-top:2px">${skipped} ข้าม (id ซ้ำ — ของเก่าไม่ถูกแตะ)</div>`;

function openImport(){const o=g('import-overlay');if(o){o.classList.add('on');const r=g('import-result');if(r)r.innerHTML='';const t=g('import-text');if(t)t.value='';}}
function closeImport(e){if(e&&e.currentTarget!==e.target)return;const o=g('import-overlay');if(o)o.classList.remove('on');}
function onImportFile(inp){const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{const ta=g('import-text');if(ta)ta.value=rd.result;};rd.readAsText(f);}
function toggleRecEdit(){recEdit=!recEdit;recArmId=null;renderRecords();}
function toggleRecExpand(id){recExpandedId=recExpandedId===id?null:id;renderRecords();}
function armDeleteRecord(id){recArmId=recArmId===id?null:id;renderRecords();}
function deleteRecord(id){

  if(data.exportedCount>data.records.length)data.exportedCount=data.records.length;

function exportFileStep(btn){

  if(step==='0'){
    btn.innerHTML=`${DL_ICON} Export JSON + CSV?`;
    btn.dataset.step='1';btn.style.background='var(--acc)';btn.style.color='#fff';
    clearTimeout(btn._te);btn._te=setTimeout(()=>resetExportBtn(btn),2500);
  }else if(step==='1'){
    btn.innerHTML=`${DL_ICON} ยืนยัน Export`;btn.dataset.step='2';
    clearTimeout(btn._te);btn._te=setTimeout(()=>resetExportBtn(btn),2500);
  }else{
    clearTimeout(btn._te);
    exportRecords();

function resetExportBtn(btn){

}
function clearRecords(btn){
  const data=loadRecords();
  const unexported=Math.max(0,data.records.length-(data.exportedCount||0));
  const step=btn.dataset.step||'0';
  if(step==='0'){
    btn.textContent=unexported>0?`Clear all (${unexported} ยังไม่ export)`:'Clear all';
    btn.dataset.step='1';btn.style.background='#FF3B30';btn.style.color='#fff';
    clearTimeout(btn._t);btn._t=setTimeout(()=>resetClearBtn(btn),2500);
  }else if(step==='1'){
    btn.textContent='ยืนยัน Clear all';btn.dataset.step='2';

  }else{

function renderRecords(){
  const el=g('record-content');if(!el)return;
  const data=loadRecords();
  const all=data.records;
  if(!all.length){
    let emptyHtml=`<div style="padding:40px 16px;text-align:center;color:var(--hint);font-size:14px">ยังไม่มี record<br><span style="font-size:12px">trade ที่ archive จาก Position จะมาเก็บที่นี่</span></div>`;
    emptyHtml+=buildCloudSyncUI();
    emptyHtml+=buildSyncGuideUI();
    if(fbUser&&firebaseReady()){
      emptyHtml+=`<div style="text-align:center;font-size:12px;color:var(--sub);margin-top:8px">กด Pull เพื่อดึง data จาก cloud</div>`;
    }
    el.innerHTML=emptyHtml;
    return;
  }
  const symbols=[...new Set(all.map(r=>r.eval.symbol))];
  if(recFilter!=='all'&&!symbols.includes(recFilter))recFilter='all';
  const strategies=[...new Set(all.map(r=>r.eval.strategy).filter(s=>s&&String(s).trim()))];
  if(stratFilter!=='all'&&!strategies.includes(stratFilter))stratFilter='all';
  // filter
  let recs=all.slice();
  if(recFilter!=='all')recs=recs.filter(r=>r.eval.symbol===recFilter);
  if(stratFilter!=='all')recs=recs.filter(r=>(r.eval.strategy||'')===stratFilter);
  // sort
  const rank=o=>o==='win'?0:o==='breakeven'?1:2;
  if(recSort==='latest')recs.reverse();
  else if(recSort==='pl')recs.sort((a,b)=>b.eval.realizedPL-a.eval.realizedPL);
  else if(recSort==='wl')recs.sort((a,b)=>rank(a.eval.outcome)-rank(b.eval.outcome)||b.eval.realizedPL-a.eval.realizedPL);
  // summary (on filtered set)
  const n=recs.length;
  const totalPL=recs.reduce((s,r)=>s+(r.eval.realizedPL||0),0);
  const wins=recs.filter(r=>r.eval.outcome==='win').length;
  const winRate=n?(wins/n*100):0;
  const rVals=recs.map(r=>r.eval.rMultiple).filter(v=>isFinite(v));
  const avgR=rVals.length?rVals.reduce((a,b)=>a+b,0)/rVals.length:0;
  const plColor=totalPL>0?'var(--green)':totalPL<0?'var(--red)':'var(--text)';
  // expanded portfolio stats (on filtered set)
  const winRecs=recs.filter(r=>r.eval.outcome==='win');
  const lossRecs=recs.filter(r=>r.eval.outcome==='loss');
  const grossProfit=winRecs.reduce((s,r)=>s+(r.eval.realizedPL||0),0);
  const grossLoss=Math.abs(lossRecs.reduce((s,r)=>s+(r.eval.realizedPL||0),0));
  const profitFactor=grossLoss>0?grossProfit/grossLoss:(grossProfit>0?Infinity:0);
  const expectancy=n?totalPL/n:0;
  const avgWin=winRecs.length?grossProfit/winRecs.length:0;
  const avgLoss=lossRecs.length?-grossLoss/lossRecs.length:0;

    html+=`<div style="display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap;align-items:center"><span style="font-size:11px;color:var(--hint);text-transform:uppercase;letter-spacing:.04em;margin-right:1px">Strategy</span>${schip('all','All')}${strategies.map(s=>schip(s,s)).join('')}</div>`;

// ─── Phase 4: Import Tab1 → Tab2 ─────────────────────
function buildEntryId(n){
  const inst=(g(`p${n}-inst`)?.value||'').toUpperCase();
  const dir=g(`p${n}-dir`)?.value==='long'?'L':'S';
  const raw=g(`p${n}-edate`)?.dataset?.full||g(`p${n}-edate`)?.value||'';
  const p=parseDateParts(raw);const z=v=>String(v).padStart(2,'0');
  const ddmmyy=p?z(p.d)+z(p.mo)+String(p.y).slice(2):'000000';
  const hhmm=p?z(p.h)+z(p.mi):'0000';
  return `${inst}.O.${dir}.${ddmmyy}.${hhmm}`;
}
function buildPacket(n){
  const inst=g(`p${n}-inst`)?.value||'';
  const sym=getSymbol(inst);
  const entry=parseNum(g(`p${n}-entry`)?.value)||0;
  const sl=parseNum(g(`p${n}-sl`)?.value)||0;
  const lot=parseFloat(g(`p${n}-lot`)?.value)||0;
  const cv=lot*sym.unit*entry;
  const lev=parseFloat(g(`p${n}-lev`)?.value)||25;
  const vsd=g(`p${n}-vsd`)?.value||'';
  const vsf=g(`p${n}-vsf`)?.value||'';
  const sld=entry>0&&vsd?entry*(parseFloat(vsd)/100)*(parseFloat(vsf)||1):Math.abs(entry-sl);
  const now=new Date();
  const pad=v=>String(v).padStart(2,'0');
  const importedAt=`${pad(now.getDate())}/${pad(now.getMonth()+1)}/${String(now.getFullYear()).slice(2)} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  return {
    version:'v1',
    id:buildEntryId(n),
    meta:{state:'ACTIVE',importedAt,closedAt:null},
    entry:{
      date:g(`p${n}-edate`)?.dataset?.full||g(`p${n}-edate`)?.value||'',
      inst,dir:g(`p${n}-dir`)?.value||'long',
      strategy:g(`p${n}-strategy`)?.value||'',
      price:String(entry),sl:String(sl),
      rmode:riskMode[n]||'fixed',
      rpt:g(`p${n}-rpt`)?.value||'',
      vsd,vsf,
      sld:String(sld.toFixed(2)),
      usedLot:String(lot),
      usedCV:String(cv.toFixed(0)),
      lev:String(lev),
      entryScore:g(`p${n}-entry-score`)?.value||'',
      entryNote:g(`p${n}-entry-note`)?.value||''
    },
    exit:{trailSL:'',note:'',cl:{price:'',date:'',method:'',lot:'',score:''},t1:{price:'',date:'',method:'',lot:'',score:''},t2:{price:'',date:'',method:'',lot:'',score:''},t3:{price:'',date:'',method:'',lot:'',score:''}}
  };
}
function importToSession(n){
  const btn=g('p1-import-btn');
  // validate required fields
  const inst=g(`p${n}-inst`)?.value;
  const entry=parseNum(g(`p${n}-entry`)?.value);
  const lot=parseFloat(g(`p${n}-lot`)?.value);
  if(!inst||!entry||!lot){
    btn.textContent='กรอก Symbol / Entry / Lot ก่อน';
    btn.style.background='var(--red)';
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>{btn.textContent='Import →';btn.style.background='var(--acc)';btn.dataset.confirm='';},2000);
    return;
  }
  // 2-step confirm
  if(btn.dataset.confirm!=='1'){
    btn.textContent='ยืนยัน Import?';
    btn.style.background='';
    btn.style.color='';
    btn.classList.add('confirm');
    btn.dataset.confirm='1';
    clearTimeout(btn._t);
    btn._t=setTimeout(()=>{btn.textContent='Import →';btn.classList.remove('confirm');btn.dataset.confirm='';},2500);
    return;
  }
  // build packet
  btn.dataset.confirm='';
  btn.classList.remove('confirm');
  const packet=buildPacket(n);
  const data=loadSession();
  // duplicate ID check
  let finalId=packet.id;
  const existing=data.positions.map(p=>p.id);
  if(existing.includes(finalId)){
    let suffix=2;
    while(existing.includes(finalId+'-'+suffix))suffix++;
    finalId=finalId+'-'+suffix;
    packet.id=finalId;
  }
  data.positions.push(packet);
  saveSession(data);
  // feedback
  btn.textContent='✓ Imported!';
  btn.style.background='var(--green)';
  clearTimeout(btn._t);
  btn._t=setTimeout(()=>{btn.textContent='Import →';btn.style.background='var(--acc)';},2000);
  // switch to Tab2
  switchTab('session',document.querySelector('[onclick*="session"]'));
  renderSession();
}

// ── Flexible date parser ──
// Accepts: 17/6/26 21:28 · 17/06/2026 21:28 · 2026-06-17 21:28:29
//          17/06/2026 21:28:29.881(UTC+7:00) · GMT-5 · UTC etc.
// Converts to UTC+7 (Bangkok). Returns storage format: yyyy/mm/dd hh:mm:ss
const TARGET_TZ_OFFSET=7; // UTC+7 Bangkok
function parseDateFlexible(raw){
  if(!raw||!raw.trim())return '';
  raw=raw.trim();
  // extract timezone offset if present: (UTC+7:00) (UTC-5) GMT+7 GMT-05:00 +07:00 Z
  let srcOffset=null; // hours from UTC
  const tzM=raw.match(/(?:UTC|GMT)\s*([+-])(\d{1,2})(?::?(\d{2}))?/i)
        || raw.match(/([+-])(\d{2}):?(\d{2})\s*$/);
  if(tzM){
    const sign=tzM[1]==='-'?-1:1;
    srcOffset=sign*(parseInt(tzM[2],10)+(tzM[3]?parseInt(tzM[3],10)/60:0));
  }else if(/\bUTC\b|\bGMT\b|Z\s*$/i.test(raw)){
    srcOffset=0; // bare UTC/GMT/Z = offset 0
  }
  // strip timezone + fractional seconds + trailing junk
  let s=raw.replace(/\(?\s*(?:UTC|GMT)\s*[+-]?\d{0,2}:?\d{0,2}\s*\)?/ig,'')
           .replace(/[+-]\d{2}:?\d{2}\s*$/,'')
           .replace(/Z\s*$/i,'')
           .replace(/\.\d+/,'')
           .trim();
  // parse the bare datetime via canonical parser (TZ already stripped)
  let y,mo,d,h=0,mi=0,sec=0;
  const pp=parseDateParts(s);
  if(!pp)return raw; // unparseable — keep raw
  y=pp.y;mo=pp.mo;d=pp.d;h=pp.h;mi=pp.mi;sec=pp.sec;
  // build a Date in UTC from the parsed components, then shift by tz
  let dt=new Date(Date.UTC(y,mo-1,d,h,mi,sec));
  if(srcOffset!==null){
    // convert: source local → UTC → target (UTC+7)
    dt=new Date(dt.getTime()-srcOffset*3600000+TARGET_TZ_OFFSET*3600000);
  }
  // if no tz given, assume already in target tz (no shift)
  const p=v=>String(v).padStart(2,'0');
  return `${dt.getUTCFullYear()}/${p(dt.getUTCMonth()+1)}/${p(dt.getUTCDate())} ${p(dt.getUTCHours())}:${p(dt.getUTCMinutes())}:${p(dt.getUTCSeconds())}`;
}
// display: yyyy/mm/dd hh:mm:ss → dd/mm/yy hh:mm
function dateDisplay(stored){
  if(!stored)return '';
  const m=stored.match(/^(\d{4})\/(\d{2})\/(\d{2})\s+(\d{2}):(\d{2})/);
  if(!m)return stored;
  return `${m[3]}/${m[2]}/${m[1].slice(2)} ${m[4]}:${m[5]}`;
}
function onEdateBlur(el){
  const raw=el.value.trim();if(!raw){saveData();return;}
  const stored=parseDateFlexible(raw);  // yyyy/mm/dd hh:mm:ss
  if(stored&&/^\d{4}\//.test(stored)){
    el.dataset.full=stored;
    el.value=dateDisplay(stored);       // dd/mm/yy hh:mm
    el.style.color='var(--blue)';
  }
  saveData();
}
